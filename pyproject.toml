[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphtools"
version = "0.1.0"
description = "Graphon sampling and graph analysis tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib",
    "networkx",
    "numpy",
    "POT>=0.9.7",
    "scipy",
    "shapely>=2.1",
    "torch",
    "torch-geometric",
    "torch-kmeans",
    "tqdm",
]

[project.optional-dependencies]
notebook = [
    "ipykernel",
    "ipywidgets",
]
test = [
    "pytest",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
filterwarnings = [
    'ignore:^`torch\.jit\.script` is deprecated\. Please switch to `torch\.compile` or `torch\.export`\.$:FutureWarning:^torch\.jit\._script$',
]
