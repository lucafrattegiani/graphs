name: Tests

on: push

permissions:
  contents: read

jobs:
  tests:
    name: CPU tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            envs/requirements-torch-cpu.txt

      - name: Install dependencies
        run: |
          python -m pip install "pip>=21.3"
          python -m pip install -r envs/requirements-torch-cpu.txt
          python -m pip install ".[test,notebook]"
          python -m pip check

      - name: Run tests
        run: python -m pytest tests -v -ra
